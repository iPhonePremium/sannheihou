<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>三平方の定理計算機</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
  background: #f3f4f6;
  color: #111827;
  transition: .25s;
}

body.dark {
  background: #0b1120;
  color: #f9fafb;
}

header {
  padding: 28px 20px;
  text-align: center;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  opacity: .9;
}

.container {
  width: min(900px, calc(100% - 24px));
  margin: 20px auto 40px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

.dark .card {
  background: #111827;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

.mode {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.mode button,
.action {
  border: 0;
  border-radius: 12px;
  padding: 12px 15px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
}

.mode button {
  flex: 1;
  background: #e5e7eb;
  color: #374151;
}

.dark .mode button {
  background: #1f2937;
  color: #d1d5db;
}

.mode button.active {
  background: #2563eb;
  color: white;
}

.inputs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.input-box label {
  display: block;
  font-weight: 700;
  margin-bottom: 7px;
}

.input-box input {
  width: 100%;
  padding: 14px;
  border: 2px solid #d1d5db;
  border-radius: 12px;
  font-size: 18px;
  outline: none;
  background: white;
  color: #111827;
}

.dark .input-box input {
  background: #1f2937;
  border-color: #374151;
  color: white;
}

.input-box input:focus {
  border-color: #2563eb;
}

.hint {
  color: #6b7280;
  font-size: 13px;
  margin-top: 6px;
}

.dark .hint {
  color: #9ca3af;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.calculate {
  flex: 1;
  background: #2563eb;
  color: white;
}

.reset {
  background: #e5e7eb;
  color: #374151;
}

.dark .reset {
  background: #374151;
  color: white;
}

.result {
  display: none;
}

.result.show {
  display: block;
}

.answer {
  text-align: center;
  padding: 20px;
  border-radius: 16px;
  background: #eff6ff;
  border: 2px solid #bfdbfe;
}

.dark .answer {
  background: #172554;
  border-color: #1d4ed8;
}

.answer .label {
  font-size: 14px;
  opacity: .8;
}

.answer .number {
  font-size: 42px;
  font-weight: 800;
  color: #2563eb;
  margin: 5px 0;
}

.dark .answer .number {
  color: #60a5fa;
}

.exact {
  font-size: 17px;
  font-weight: 700;
}

.steps {
  margin-top: 18px;
}

.steps h2 {
  font-size: 19px;
}

.step {
  padding: 13px 15px;
  background: #f9fafb;
  border-radius: 12px;
  margin: 8px 0;
  font-family: "Times New Roman", serif;
  font-size: 18px;
}

.dark .step {
  background: #1f2937;
}

.info {
  padding: 14px;
  border-radius: 12px;
  background: #fef3c7;
  color: #78350f;
  margin-top: 15px;
}

.dark .info {
  background: #451a03;
  color: #fde68a;
}

.error {
  display: none;
  padding: 14px;
  border-radius: 12px;
  background: #fee2e2;
  color: #991b1b;
  margin-top: 15px;
}

.error.show {
  display: block;
}

.theorem {
  text-align: center;
  font-size: 25px;
  font-weight: 800;
  padding: 18px;
  background: #f9fafb;
  border-radius: 15px;
}

.dark .theorem {
  background: #1f2937;
}

.examples {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.example {
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #d1d5db;
  background: transparent;
  cursor: pointer;
  color: inherit;
}

.example:hover {
  border-color: #2563eb;
}

footer {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  padding: 10px;
}

.dark footer {
  color: #9ca3af;
}

.top-buttons {
  position: absolute;
  right: 15px;
  top: 15px;
}

.theme {
  border: 0;
  background: rgba(255,255,255,.2);
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-size: 19px;
}

@media (max-width: 650px) {
  header h1 {
    font-size: 23px;
  }

  .inputs {
    grid-template-columns: 1fr;
  }

  .examples {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-direction: column;
  }

  .answer .number {
    font-size: 36px;
  }
}
</style>
</head>

<body>

<header>
  <div class="top-buttons">
    <button class="theme" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <h1>📐 三平方の定理計算機</h1>
  <p>直角三角形の辺を入力するだけで自動計算</p>
</header>

<div class="container">

  <div class="card">

    <div class="mode">
      <button class="active" onclick="setMode('two')" id="twoBtn">
        2辺から計算
      </button>
      <button onclick="setMode('one')" id="oneBtn">
        1辺＋他の条件
      </button>
    </div>

    <div id="twoMode">

      <div class="inputs">

        <div class="input-box">
          <label>辺 a</label>
          <input type="number" id="a" min="0" step="any"
                 placeholder="例：3">
          <div class="hint">直角をはさむ辺</div>
        </div>

        <div class="input-box">
          <label>辺 b</label>
          <input type="number" id="b" min="0" step="any"
                 placeholder="例：4">
          <div class="hint">直角をはさむ辺</div>
        </div>

        <div class="input-box">
          <label>辺 c</label>
          <input type="number" id="c" min="0" step="any"
                 placeholder="例：5">
          <div class="hint">斜辺</div>
        </div>

      </div>

      <div class="hint" style="margin-top:12px">
        ※ 3つのうち<strong>2つだけ</strong>入力してください。
      </div>

      <div class="actions">
        <button class="action calculate" onclick="calculate()">
          🧮 計算する
        </button>
        <button class="action reset" onclick="resetAll()">
          ↺ リセット
        </button>
      </div>

      <div class="error" id="error"></div>

    </div>

    <div id="oneMode" style="display:none">

      <div class="inputs">

        <div class="input-box">
          <label>既知の辺</label>
          <input type="number" id="known" min="0" step="any"
                 placeholder="例：5">
        </div>

        <div class="input-box">
          <label>もう一方の辺</label>
          <input type="number" id="known2" min="0" step="any"
                 placeholder="例：3">
        </div>

      </div>

      <div class="hint" style="margin-top:12px">
        2つの辺を入力すると、残りの辺を計算できます。
      </div>

      <div class="actions">
        <button class="action calculate" onclick="calculate()">
          🧮 計算する
        </button>
      </div>

    </div>

  </div>

  <div class="card">

    <h2>📖 三平方の定理</h2>

    <div class="theorem">
      a² ＋ b² ＝ c²
    </div>

    <p>
      直角三角形では、直角をはさむ2辺の2乗の和が、
      斜辺の2乗に等しくなります。
    </p>

  </div>

  <div class="card result" id="result">

    <div class="answer">

      <div class="label" id="answerLabel">計算結果</div>

      <div class="number" id="answerNumber">5</div>

      <div class="exact" id="exactNumber"></div>

    </div>

    <div class="steps">

      <h2>📝 計算過程</h2>

      <div id="steps"></div>

    </div>

    <div class="info" id="triangleInfo"></div>

  </div>

  <div class="card">

    <h2>⚡ よく使う例</h2>

    <div class="examples">

      <button class="example" onclick="example(3,4,null)">
        <strong>3・4・?</strong><br>
        → 5
      </button>

      <button class="example" onclick="example(5,12,null)">
        <strong>5・12・?</strong><br>
        → 13
      </button>

      <button class="example" onclick="example(8,15,null)">
        <strong>8・15・?</strong><br>
        → 17
      </button>

    </div>

  </div>

</div>

<footer>
  三平方の定理計算機
</footer>

<script>

let currentMode = "two";

function setMode(mode) {
  currentMode = mode;

  document.getElementById("twoMode").style.display =
    mode === "two" ? "block" : "none";

  document.getElementById("oneMode").style.display =
    mode === "one" ? "block" : "none";

  document.getElementById("twoBtn").classList.toggle(
    "active", mode === "two"
  );

  document.getElementById("oneBtn").classList.toggle(
    "active", mode === "one"
  );
}

function cleanNumber(n) {
  if (Math.abs(n - Math.round(n)) < 1e-10) {
    return String(Math.round(n));
  }

  return Number(n.toFixed(10)).toString();
}

function sqrtExact(value) {

  const root = Math.sqrt(value);

  if (Number.isInteger(root)) {
    return String(root);
  }

  // 簡単な平方因数を探す
  let outside = 1;
  let inside = Math.round(value);

  for (let i = 2; i * i <= inside; i++) {
    while (inside % (i * i) === 0) {
      outside *= i;
      inside /= i * i;
    }
  }

  if (outside !== 1) {
    if (inside === 1) return String(outside);
    return outside + "√" + inside;
  }

  return "√" + cleanNumber(value);
}

function calculate() {

  const error = document.getElementById("error");
  error.classList.remove("show");

  let a, b, c, answer, label, steps = [];

  if (currentMode === "two") {

    a = getValue("a");
    b = getValue("b");
    c = getValue("c");

    const count = [a,b,c].filter(x => x !== null).length;

    if (count !== 2) {
      showError("a・b・cのうち、2つだけ入力してください。");
      return;
    }

    if ([a,b,c].some(x => x !== null && x <= 0)) {
      showError("辺の長さは0より大きい数にしてください。");
      return;
    }

    if (c === null) {

      answer = Math.sqrt(a*a + b*b);
      label = "斜辺 c";

      steps.push(
        `c² = a² ＋ b²`
      );

      steps.push(
        `c² = ${cleanNumber(a)}² ＋ ${cleanNumber(b)}²`
      );

      steps.push(
        `c² = ${cleanNumber(a*a + b*b)}`
      );

      steps.push(
        `c = √${cleanNumber(a*a + b*b)}`
      );

      steps.push(
        `c = ${cleanNumber(answer)}`
      );

    } else if (a === null) {

      if (c <= b) {
        showError("斜辺 c は b より長くなければなりません。");
        return;
      }

      answer = Math.sqrt(c*c - b*b);
      label = "辺 a";

      steps.push(`a² = c² − b²`);
      steps.push(
        `a² = ${cleanNumber(c)}² − ${cleanNumber(b)}²`
      );
      steps.push(
        `a² = ${cleanNumber(c*c - b*b)}`
      );
      steps.push(
        `a = √${cleanNumber(c*c - b*b)}`
      );
      steps.push(`a = ${cleanNumber(answer)}`);

    } else {

      if (c <= a) {
        showError("斜辺 c は a より長くなければなりません。");
        return;
      }

      answer = Math.sqrt(c*c - a*a);
      label = "辺 b";

      steps.push(`b² = c² − a²`);
      steps.push(
        `b² = ${cleanNumber(c)}² − ${cleanNumber(a)}²`
      );
      steps.push(
        `b² = ${cleanNumber(c*c - a*a)}`
      );
      steps.push(
        `b = √${cleanNumber(c*c - a*a)}`
      );
      steps.push(`b = ${cleanNumber(answer)}`);
    }

  } else {

    const x = Number(document.getElementById("known").value);
    const y = Number(document.getElementById("known2").value);

    if (!x || !y || x <= 0 || y <= 0) {
      showError("2つの辺を正しく入力してください。");
      return;
    }

    // ここでは斜辺が x と仮定
    if (x > y) {
      c = x;
      a = y;
      answer = Math.sqrt(c*c - a*a);
      label = "もう一方の直角辺";

      if (answer <= 0) {
        showError("入力値では直角三角形を作れません。");
        return;
      }

      steps.push(`求める辺² = 斜辺² − 既知の辺²`);
      steps.push(
        `求める辺² = ${cleanNumber(c)}² − ${cleanNumber(a)}²`
      );
      steps.push(
        `求める辺² = ${cleanNumber(c*c-a*a)}`
      );
      steps.push(
        `求める辺 = ${cleanNumber(answer)}`
      );

    } else {
      a = x;
      b = y;
      answer = Math.sqrt(a*a + b*b);
      label = "斜辺";

      steps.push(`c² = a² ＋ b²`);
      steps.push(
        `c² = ${cleanNumber(a)}² ＋ ${cleanNumber(b)}²`
      );
      steps.push(
        `c² = ${cleanNumber(a*a+b*b)}`
      );
      steps.push(`c = ${cleanNumber(answer)}`);
    }
  }

  showResult(answer, label, steps);
}

function showResult(answer, label, steps) {

  const result = document.getElementById("result");

  result.classList.add("show");

  document.getElementById("answerLabel").textContent = label;

  document.getElementById("answerNumber").textContent =
    cleanNumber(answer);

  // 完全平方数でない場合の平方根表示
  const squared = answer * answer;
  const rounded = Math.round(squared);

  if (Math.abs(squared - rounded) < 1e-8 &&
      !Number.isInteger(answer)) {

    document.getElementById("exactNumber").textContent =
      "＝ " + sqrtExact(rounded);

  } else {
    document.getElementById("exactNumber").textContent = "";
  }

  document.getElementById("steps").innerHTML =
    steps.map((s, i) =>
      `<div class="step">${i+1}. ${s}</div>`
    ).join("");

  document.getElementById("triangleInfo").innerHTML =
    "✅ 計算完了！答えを確認してください。";

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function getValue(id) {

  const value = document.getElementById(id).value;

  if (value === "") return null;

  return Number(value);
}

function showError(message) {

  const error = document.getElementById("error");

  error.textContent = "⚠️ " + message;
  error.classList.add("show");
}

function resetAll() {

  document.querySelectorAll("input").forEach(input => {
    input.value = "";
  });

  document.getElementById("result").classList.remove("show");
  document.getElementById("error").classList.remove("show");
}

function example(a,b,c) {

  document.getElementById("a").value =
    a ?? "";

  document.getElementById("b").value =
    b ?? "";

  document.getElementById("c").value =
    c ?? "";

  setMode("two");

  calculate();
}

function toggleTheme() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  document.getElementById("themeBtn").textContent =
    dark ? "☀️" : "🌙";

  localStorage.setItem("theme", dark ? "dark" : "light");
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  document.getElementById("themeBtn").textContent = "☀️";
}

</script>

</body>
</html>
