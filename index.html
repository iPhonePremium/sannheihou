<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">

<title>三平方の定理計算機</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #111827;
  --sub: #6b7280;
  --border: #d1d5db;
  --primary: #2563eb;
  --primary2: #7c3aed;
  --input: #ffffff;
  --soft: #eff6ff;
}

body.dark {
  --bg: #080d19;
  --card: #111827;
  --text: #f9fafb;
  --sub: #9ca3af;
  --border: #374151;
  --input: #1f2937;
  --soft: #172554;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  transition: background .25s, color .25s;
}

header {
  position: relative;
  padding: 30px 20px;
  text-align: center;
  color: white;
  background:
    linear-gradient(135deg, #2563eb, #7c3aed);
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
  opacity: .9;
}

.theme {
  position: absolute;
  right: 16px;
  top: 16px;

  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: rgba(255,255,255,.2);
  color: white;

  font-size: 19px;
  cursor: pointer;
}

.container {
  width: min(900px, calc(100% - 24px));
  margin: 20px auto 40px;
}

.card {
  background: var(--card);
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.07);
}

.mode {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.mode button {
  flex: 1;
  padding: 12px;

  border: 0;
  border-radius: 12px;

  background: #e5e7eb;
  color: #374151;

  font-weight: 700;
  cursor: pointer;
}

.dark .mode button {
  background: #1f2937;
  color: #d1d5db;
}

.mode button.active {
  background: var(--primary);
  color: white;
}

.inputs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.input-box label {
  display: block;
  margin-bottom: 7px;
  font-weight: 700;
}

.input-box input {
  width: 100%;
  padding: 14px;

  border: 2px solid var(--border);
  border-radius: 12px;

  background: var(--input);
  color: var(--text);

  font-size: 19px;
  outline: none;
}

.input-box input:focus {
  border-color: var(--primary);
}

.hint {
  margin-top: 6px;
  color: var(--sub);
  font-size: 13px;
}

/* 数学キーボード */

.math-keyboard {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;

  margin-top: 12px;
}

.math-keyboard button {
  min-height: 44px;

  border: 1px solid var(--border);
  border-radius: 10px;

  background: var(--input);
  color: var(--text);

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;
}

.math-keyboard button:hover {
  border-color: var(--primary);
}

.math-keyboard button:active {
  transform: scale(.97);
}

.keyboard-label {
  margin-top: 16px;
  color: var(--sub);
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.action {
  border: 0;
  border-radius: 12px;

  padding: 13px 18px;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.calculate {
  flex: 1;
  background: var(--primary);
  color: white;
}

.reset {
  background: #e5e7eb;
  color: #374151;
}

.dark .reset {
  background: #374151;
  color: white;
}

.error {
  display: none;

  margin-top: 15px;
  padding: 14px;

  border-radius: 12px;

  background: #fee2e2;
  color: #991b1b;
}

.error.show {
  display: block;
}

/* 結果 */

.result {
  display: none;
}

.result.show {
  display: block;
}

.answer {
  padding: 22px;

  text-align: center;

  border-radius: 17px;

  background: var(--soft);
  border: 2px solid #bfdbfe;
}

.answer .label {
  color: var(--sub);
  font-size: 14px;
}

.answer .number {
  margin: 4px 0;

  color: var(--primary);

  font-size: 44px;
  font-weight: 900;
}

.exact {
  font-size: 19px;
  font-weight: 700;
}

.steps {
  margin-top: 20px;
}

.steps h2 {
  font-size: 19px;
}

.step {
  margin: 8px 0;
  padding: 14px;

  border-radius: 12px;

  background: rgba(127,127,127,.08);

  font-family:
    "Times New Roman",
    "Noto Serif JP",
    serif;

  font-size: 19px;
}

.info {
  margin-top: 16px;
  padding: 14px;

  border-radius: 12px;

  background: #fef3c7;
  color: #78350f;
}

.dark .info {
  background: #451a03;
  color: #fde68a;
}

/* 定理 */

.theorem {
  padding: 18px;

  text-align: center;

  border-radius: 15px;

  background: rgba(127,127,127,.08);

  font-size: 27px;
  font-weight: 900;
}

/* 例 */

.examples {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.example {
  padding: 15px;

  border: 1px solid var(--border);
  border-radius: 12px;

  background: transparent;
  color: var(--text);

  cursor: pointer;
}

.example:hover {
  border-color: var(--primary);
}

footer {
  padding: 10px;
  text-align: center;

  color: var(--sub);
  font-size: 13px;
}

@media (max-width: 650px) {

  header h1 {
    font-size: 23px;
  }

  .inputs {
    grid-template-columns: 1fr;
  }

  .examples {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-direction: column;
  }

  .math-keyboard {
    grid-template-columns: repeat(4, 1fr);
  }

  .answer .number {
    font-size: 37px;
  }

  .theorem {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header>

<button class="theme" id="themeBtn" onclick="toggleTheme()">
🌙
</button>

<h1>三平方の定理計算機</h1>

<p>
√・小数・整数に対応した三平方の定理計算ツール
</p>

</header>

<div class="container">

<!-- 入力 -->

<div class="card">

<div class="mode">

<button
  id="twoBtn"
  class="active"
  onclick="setMode('two')">

2辺から計算

</button>

<button
  id="oneBtn"
  onclick="setMode('one')">

1辺＋条件

</button>

</div>


<div id="twoMode">

<div class="inputs">

<div class="input-box">

<label>辺 a</label>

<input
  id="a"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="例：3、√2">

<div class="hint">
直角をはさむ辺
</div>

</div>


<div class="input-box">

<label>辺 b</label>

<input
  id="b"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="例：4、3√2">

<div class="hint">
直角をはさむ辺
</div>

</div>


<div class="input-box">

<label>辺 c</label>

<input
  id="c"
  type="text"
  inputmode="text"
  autocomplete="off"
  placeholder="例：5、√13">

<div class="hint">
斜辺
</div>

</div>

</div>


<div class="keyboard-label">
数式入力ボタン
</div>

<div class="math-keyboard">

<button onclick="insertSymbol('√')">√</button>
<button onclick="insertSymbol('²')">²</button>
<button onclick="insertSymbol('(')">(</button>
<button onclick="insertSymbol(')')">)</button>
<button onclick="insertSymbol('＋')">＋</button>

<button onclick="insertSymbol('−')">−</button>
<button onclick="insertSymbol('×')">×</button>
<button onclick="insertSymbol('÷')">÷</button>
<button onclick="insertSymbol('.')">.</button>
<button onclick="backspace()">⌫</button>

</div>


<div class="hint">
例：√2、3√2、√(5)、2.5 など
</div>


<div class="actions">

<button
  class="action calculate"
  onclick="calculate()">

🧮 計算する

</button>

<button
  class="action reset"
  onclick="resetAll()">

↺ リセット

</button>

</div>


<div class="error" id="error"></div>

</div>


<!-- もう一つのモード -->

<div id="oneMode" style="display:none">

<div class="inputs">

<div class="input-box">

<label>既知の辺</label>

<input
  id="known"
  type="text"
  inputmode="text"
  placeholder="例：5、√13">

</div>

<div class="input-box">

<label>もう一方の辺</label>

<input
  id="known2"
  type="text"
  inputmode="text"
  placeholder="例：3、√5">

</div>

</div>

<div class="hint" style="margin-top:12px">
大きい方を斜辺として自動判定します。
</div>

<div class="actions">

<button
  class="action calculate"
  onclick="calculate()">

🧮 計算する

</button>

</div>

</div>

</div>


<!-- 定理 -->

<div class="card">

<h2>📖 三平方の定理</h2>

<div class="theorem">
a² ＋ b² ＝ c²
</div>

<p>
直角三角形では、直角をはさむ2辺の2乗の和が
斜辺の2乗に等しくなります。
</p>

</div>


<!-- 結果 -->

<div class="card result" id="result">

<div class="answer">

<div class="label" id="answerLabel">
計算結果
</div>

<div class="number" id="answerNumber">
5
</div>

<div class="exact" id="exactNumber"></div>

</div>


<div class="steps">

<h2>📝 計算過程</h2>

<div id="steps"></div>

</div>


<div class="info" id="triangleInfo">
</div>

</div>


<!-- 例 -->

<div class="card">

<h2>⚡ よく使う例</h2>

<div class="examples">

<button
  class="example"
  onclick="example('3','4','')">

<strong>3・4・?</strong><br>
→ 5

</button>

<button
  class="example"
  onclick="example('5','12','')">

<strong>5・12・?</strong><br>
→ 13

</button>

<button
  class="example"
  onclick="example('√2','√2','')">

<strong>√2・√2・?</strong><br>
→ 2

</button>

</div>

</div>

</div>


<footer>
三平方の定理計算機
</footer>


<script>

/* =========================
   モード
========================= */

let currentMode = "two";

function setMode(mode) {

  currentMode = mode;

  document.getElementById("twoMode").style.display =
    mode === "two" ? "block" : "none";

  document.getElementById("oneMode").style.display =
    mode === "one" ? "block" : "none";

  document.getElementById("twoBtn").classList.toggle(
    "active",
    mode === "two"
  );

  document.getElementById("oneBtn").classList.toggle(
    "active",
    mode === "one"
  );
}


/* =========================
   数式入力
========================= */

let activeInput = null;

document.querySelectorAll("input").forEach(input => {

  input.addEventListener("focus", () => {
    activeInput = input;
  });

});


function insertSymbol(symbol) {

  if (!activeInput) {

    activeInput =
      document.querySelector("#a");

    activeInput.focus();

  }

  const start = activeInput.selectionStart;
  const end = activeInput.selectionEnd;

  const value = activeInput.value;

  activeInput.value =
    value.substring(0,start) +
    symbol +
    value.substring(end);

  const pos = start + symbol.length;

  activeInput.setSelectionRange(pos,pos);

  activeInput.focus();
}


function backspace() {

  if (!activeInput) return;

  const start = activeInput.selectionStart;
  const end = activeInput.selectionEnd;

  const value = activeInput.value;

  if (start !== end) {

    activeInput.value =
      value.substring(0,start) +
      value.substring(end);

    activeInput.setSelectionRange(start,start);

    return;
  }

  if (start > 0) {

    activeInput.value =
      value.substring(0,start-1) +
      value.substring(start);

    activeInput.setSelectionRange(
      start-1,
      start-1
    );
  }
}


/* =========================
   √・数式を数値化
========================= */

function parseMathValue(input) {

  if (input === null || input === undefined) {
    return null;
  }

  let s = String(input)
    .trim()
    .replace(/\s/g,"")
    .replace(/ｒ/g,"r")
    .replace(/Ｒ/g,"R")
    .replace(/√/g,"sqrt")
    .replace(/＋/g,"+")
    .replace(/−/g,"-")
    .replace(/×/g,"*")
    .replace(/÷/g,"/")
    .replace(/²/g,"^2");

  if (s === "") {
    return null;
  }


  /*
    普通の数字
  */

  if (/^\d+(\.\d+)?$/.test(s)) {
    return Number(s);
  }


  /*
    √n
  */

  let match =
    s.match(/^sqrt\((\d+(?:\.\d+)?)\)$/);

  if (match) {

    const n = Number(match[1]);

    if (n < 0) return NaN;

    return Math.sqrt(n);
  }


  match =
    s.match(/^sqrt(\d+(?:\.\d+)?)$/);

  if (match) {

    const n = Number(match[1]);

    if (n < 0) return NaN;

    return Math.sqrt(n);
  }


  /*
    n√m
  */

  match =
    s.match(/^(\d+(?:\.\d+)?)sqrt(\d+(?:\.\d+)?)$/);

  if (match) {

    const outside = Number(match[1]);
    const inside = Number(match[2]);

    if (inside < 0) return NaN;

    return outside * Math.sqrt(inside);
  }


  /*
    √m × n
  */

  match =
    s.match(/^sqrt\((\d+(?:\.\d+)?)\)\*(\d+(?:\.\d+)?)$/);

  if (match) {

    return Math.sqrt(Number(match[1]))
      * Number(match[2]);
  }


  /*
    単純な加減乗除
    例：
    √2+√3
  */

  try {

    let expression = s;

    expression =
      expression.replace(
        /sqrt\((\d+(?:\.\d+)?)\)/g,
        "Math.sqrt($1)"
      );

    expression =
      expression.replace(
        /sqrt(\d+(?:\.\d+)?)/g,
        "Math.sqrt($1)"
      );

    if (!/^[0-9+\-*/().Mathsqrt]+$/.test(expression)) {
      return NaN;
    }

    const result =
      Function('"use strict"; return (' +
        expression +
      ')')();

    if (
      typeof result !== "number" ||
      !Number.isFinite(result)
    ) {
      return NaN;
    }

    return result;

  } catch {

    return NaN;
  }
}


/* =========================
   表示用
========================= */

function cleanNumber(n) {

  if (Math.abs(n - Math.round(n)) < 1e-10) {
    return String(Math.round(n));
  }

  return Number(n.toFixed(10)).toString();
}


/*
  平方根をできるだけ簡単にする
  例：
  √12 → 2√3
  √18 → 3√2
*/

function simplifySqrt(n) {

  if (n < 0) return null;

  const rounded = Math.round(n);

  const root = Math.sqrt(n);

  if (
    Math.abs(root - Math.round(root)) < 1e-10
  ) {
    return String(Math.round(root));
  }

  let outside = 1;
  let inside = rounded;

  for (let i = 2; i * i <= inside; i++) {

    while (inside % (i * i) === 0) {

      outside *= i;
      inside /= i * i;

    }
  }

  if (outside === 1) {
    return "√" + cleanNumber(n);
  }

  if (inside === 1) {
    return String(outside);
  }

  return outside + "√" + inside;
}


/* =========================
   入力取得
========================= */

function getValue(id) {

  const value =
    document.getElementById(id).value;

  return parseMathValue(value);
}


/* =========================
   エラー
========================= */

function showError(message) {

  const error =
    document.getElementById("error");

  error.textContent = "⚠️ " + message;

  error.classList.add("show");
}


/* =========================
   計算
========================= */

function calculate() {

  const error =
    document.getElementById("error");

  error.classList.remove("show");


  let a, b, c;
  let answer;
  let label;
  let steps = [];


  /* 2辺から計算 */

  if (currentMode === "two") {

    a = getValue("a");
    b = getValue("b");
    c = getValue("c");

    const count =
      [a,b,c].filter(
        x => x !== null
      ).length;

    if (count !== 2) {

      showError(
        "a・b・cのうち、2つだけ入力してください。"
      );

      return;
    }


    if (
      [a,b,c].some(
        x => x !== null &&
        (!Number.isFinite(x) || x <= 0)
      )
    ) {

      showError(
        "辺の長さを正しく入力してください。"
      );

      return;
    }


    /* cを求める */

    if (c === null) {

      answer =
        Math.sqrt(a*a + b*b);

      label = "斜辺 c";


      steps.push(
        "c² = a² ＋ b²"
      );

      steps.push(
        `c² = ${cleanNumber(a)}² ＋ ${cleanNumber(b)}²`
      );

      steps.push(
        `c² = ${cleanNumber(a*a + b*b)}`
      );

      steps.push(
        `c = ${simplifySqrt(a*a + b*b)}`
      );


    }

    /* aを求める */

    else if (a === null) {

      if (c <= b) {

        showError(
          "斜辺 c は b より長くなければなりません。"
        );

        return;
      }

      answer =
        Math.sqrt(c*c - b*b);

      label = "辺 a";


      steps.push(
        "a² = c² − b²"
      );

      steps.push(
        `a² = ${cleanNumber(c)}² − ${cleanNumber(b)}²`
      );

      steps.push(
        `a² = ${cleanNumber(c*c - b*b)}`
      );

      steps.push(
        `a = ${simplifySqrt(c*c - b*b)}`
      );

    }

    /* bを求める */

    else {

      if (c <= a) {

        showError(
          "斜辺 c は a より長くなければなりません。"
        );

        return;
      }

      answer =
        Math.sqrt(c*c - a*a);

      label = "辺 b";


      steps.push(
        "b² = c² − a²"
      );

      steps.push(
        `b² = ${cleanNumber(c)}² − ${cleanNumber(a)}²`
      );

      steps.push(
        `b² = ${cleanNumber(c*c - a*a)}`
      );

      steps.push(
        `b = ${simplifySqrt(c*c - a*a)}`
      );

    }

  }


  /* 1辺＋条件 */

  else {

    const x =
      parseMathValue(
        document.getElementById("known").value
      );

    const y =
      parseMathValue(
        document.getElementById("known2").value
      );


    if (
      !Number.isFinite(x) ||
      !Number.isFinite(y) ||
      x <= 0 ||
      y <= 0
    ) {

      showError(
        "2つの辺を正しく入力してください。"
      );

      return;
    }


    /*
      大きい方を斜辺として扱う
    */

    if (x > y) {

      c = x;
      a = y;

      if (c <= a) {

        showError(
          "直角三角形を作れません。"
        );

        return;
      }

      answer =
        Math.sqrt(c*c - a*a);

      label = "もう一方の直角辺";


      steps.push(
        "求める辺² = 斜辺² − 既知の辺²"
      );

      steps.push(
        `求める辺² = ${cleanNumber(c)}² − ${cleanNumber(a)}²`
      );

      steps.push(
        `求める辺² = ${cleanNumber(c*c-a*a)}`
      );

      steps.push(
        `求める辺 = ${simplifySqrt(c*c-a*a)}`
      );

    }

    else {

      a = x;
      b = y;

      answer =
        Math.sqrt(a*a + b*b);

      label = "斜辺";


      steps.push(
        "c² = a² ＋ b²"
      );

      steps.push(
        `c² = ${cleanNumber(a)}² ＋ ${cleanNumber(b)}²`
      );

      steps.push(
        `c² = ${cleanNumber(a*a+b*b)}`
      );

      steps.push(
        `c = ${simplifySqrt(a*a+b*b)}`
      );

    }

  }


  showResult(
    answer,
    label,
    steps
  );
}


/* =========================
   結果表示
========================= */

function showResult(
  answer,
  label,
  steps
) {

  const result =
    document.getElementById("result");

  result.classList.add("show");


  document.getElementById(
    "answerLabel"
  ).textContent = label;


  document.getElementById(
    "answerNumber"
  ).textContent =
    cleanNumber(answer);


  /*
    √表記
  */

  const exact =
    simplifySqrt(
      answer * answer
    );

  if (
    exact &&
    exact !== cleanNumber(answer)
  ) {

    document.getElementById(
      "exactNumber"
    ).textContent =
      "√表記： " + exact;

  } else {

    document.getElementById(
      "exactNumber"
    ).textContent = "";

  }


  document.getElementById(
    "steps"
  ).innerHTML =
    steps.map(
      (step, index) =>

      `<div class="step">
        ${index + 1}. ${step}
      </div>`

    ).join("");


  document.getElementById(
    "triangleInfo"
  ).textContent =
    "✅ 計算完了！";


  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


/* =========================
   例
========================= */

function example(a,b,c) {

  setMode("two");

  document.getElementById("a").value = a;
  document.getElementById("b").value = b;
  document.getElementById("c").value = c;

  calculate();
}


/* =========================
   リセット
========================= */

function resetAll() {

  document.querySelectorAll(
    "input"
  ).forEach(
    input => input.value = ""
  );

  document.getElementById(
    "result"
  ).classList.remove("show");

  document.getElementById(
    "error"
  ).classList.remove("show");
}


/* =========================
   ダークモード
========================= */

function toggleTheme() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  document.getElementById(
    "themeBtn"
  ).textContent =
    dark ? "☀️" : "🌙";

  localStorage.setItem(
    "theme",
    dark ? "dark" : "light"
  );
}


/* =========================
   保存したテーマ
========================= */

if (
  localStorage.getItem("theme")
  === "dark"
) {

  document.body.classList.add("dark");

  document.getElementById(
    "themeBtn"
  ).textContent = "☀️";
}


/* =========================
   Enterで計算
========================= */

document.querySelectorAll(
  "input"
).forEach(input => {

  input.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        calculate();
      }

    }
  );

});

</script>

</body>
</html>
